<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <!-- Green Arrowhead Marker for Data -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="500" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">GeoBeacon Tracker - Clean Architecture Diagram</text>
  <text x="500" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Inward Dependency Rule - Component Flow</text>

  <!-- OUTER LAYERS (Peers in Clean Architecture) -->

  <!-- 1. PRESENTATION LAYER -->
  <g transform="translate(40, 90)">
    <rect width="210" height="90" rx="12" fill="#1d4ed8" stroke="#3b82f6" stroke-width="2" />
    <text x="105" y="30" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. PRESENTATION (UI)</text>
    <text x="105" y="55" fill="#93c5fd" font-size="12" text-anchor="middle">TrackingViewModel</text>
    <text x="105" y="75" fill="#93c5fd" font-size="12" text-anchor="middle">MainActivity &amp; StateFlow</text>
  </g>

  <!-- 2. DATA LAYER -->
  <g transform="translate(270, 90)">
    <rect width="450" height="90" rx="12" fill="#7f1d1d" stroke="#f43f5e" stroke-width="2" />
    <text x="225" y="30" fill="#fecdd3" font-size="14" font-weight="bold" text-anchor="middle">2. DATA LAYER (Infrastructure &amp; Storage)</text>
    <text x="225" y="55" fill="#fda4af" font-size="12" text-anchor="middle">Room DB (AppDatabase, SensorDao, SensorEntity)</text>
    <text x="225" y="75" fill="#fda4af" font-size="12" text-anchor="middle">SensorRepositoryImpl - SyncRepositoryImpl - MockRemoteDataSource</text>
  </g>

  <!-- 3. SERVICE LAYER -->
  <g transform="translate(740, 90)">
    <rect width="220" height="90" rx="12" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2" />
    <text x="110" y="30" fill="#ede9fe" font-size="14" font-weight="bold" text-anchor="middle">3. SERVICE LAYER</text>
    <text x="110" y="55" fill="#ddd6fe" font-size="12" text-anchor="middle">TrackingService(Foreground)</text>
    <text x="110" y="75" fill="#ddd6fe" font-size="12" text-anchor="middle">SyncWorker</text>
  </g>

  <!-- INNER LAYER -->

  <!-- 4. DOMAIN LAYER -->
  <g transform="translate(40, 240)">
    <rect width="920" height="110" rx="12" fill="#7c2d12" stroke="#ea580c" stroke-width="2" />
    <text x="460" y="32" fill="#ffedd5" font-size="16" font-weight="bold" text-anchor="middle">4. DOMAIN LAYER (Pure Kotlin - Zero Framework Dependencies)</text>
    <text x="460" y="56" fill="#fed7aa" font-size="13" text-anchor="middle">Models (GeoPoint, BleDevice, SensorEvent)</text>
    <text x="460" y="76" fill="#fed7aa" font-size="13" text-anchor="middle">Interfaces (SensorRepository, TrackingController, SyncRepository)</text>
    <text x="460" y="96" fill="#fed7aa" font-size="13" font-style="italic" text-anchor="middle">Use Cases: ObserveCombinedSensorDataUseCase • StartTrackingUseCase • RecordSensorEventsUseCase</text>
  </g>

  <!-- CROSS-CUTTING -->

  <!-- 5. CORE / UTILS -->
  <g transform="translate(40, 410)">
    <rect width="920" height="80" rx="12" fill="#1e3a8a" stroke="#2563eb" stroke-width="2" />
    <text x="460" y="30" fill="#dbeafe" font-size="16" font-weight="bold" text-anchor="middle">5. CORE / TRANSVERSAL</text>
    <text x="460" y="50" fill="#bfdbfe" font-size="12" text-anchor="middle">Qualifiers (@IoDispatcher, @MainDispatcher, @ApplicationScope)</text>
    <text x="460" y="66" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle">ZERO DEPENDENCIES UPWARD (Agnostic to Domain, Data and UI)</text>
  </g>

  <!-- CONNECTIONS & ARROWS (INWARD / DOWNWARD) -->

  <!-- UI -> Domain -->
  <path d="M 145 180 L 145 240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Data -> Domain -->
  <path d="M 495 180 L 495 240" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Service -> Domain -->
  <path d="M 850 180 L 850 240" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Domain -> Core -->
  <path d="M 500 350 L 500 410" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" />

</svg>